name: CI

on:
  push:
  pull_request:

jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: public/ruby
      - run: bundle exec ruby -I. -e 'Dir["test/test_*.rb"].sort.each { |file| require_relative file }'
        working-directory: public/ruby

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        working-directory: public/rust
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: public/rust
      - run: cargo test
        working-directory: public/rust

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n sc.sh sc admin/recover.sh scripts/*.sh examples/*.sh
