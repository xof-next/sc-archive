name: Bug report
description: Report a reproducible SC Archive issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SC Archive version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Ruby
        - Rust
        - Shell launcher
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Operating system and runtime version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove passwords, recovery tokens, private paths, and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
